<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Voice Analysis & Design Insight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F8FAFC]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 브라우저 보안 에러로 인한 화면 멈춤(Blank Screen) 방지용 안전 스토리지 함수
        const safeGetItem = (key) => {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        };
        const safeSetItem = (key, value) => {
            try { localStorage.setItem(key, value); } catch (e) { console.warn("Storage restricted"); }
        };
        const safeRemoveItem = (key) => {
            try { localStorage.removeItem(key); } catch (e) {}
        };

        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    const iconName = name.replace(/([A-Z])/g, "-$1").toLowerCase().replace(/^-/, "");
                    iconRef.current.innerHTML = `<i data-lucide="${iconName}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size, className]);
            return <span ref={iconRef} style={{ width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></span>;
        };

        const MODEL_NAME = "gemini-flash-latest"; 
        const SESSION_KEY = "gemini_api_key_ux_hub_integrated";
        const LOCAL_STORAGE_KEY = "ux_hub_analysis_state_final";

        const PROMPTS = {
            STEP1: (data, note) => `Data: "${data}"\n${note ? `[사용자 수정 요청]: ${note}` : ""}\n분석 요약(summary)은 한국어로 작성하십시오. 답변 내에 ** 강조 표시를 절대로 포함하지 마십시오.\n[중요1]: "EXECUTIVE SUMMARY"와 각 카테고리별 "summary"의 분석 내용은 반드시 각각 4줄에서 5줄 분량으로만 작성하십시오.\n[중요2]: "opinions" 배열에는 해당 카테고리의 요약 내용에 해당되는 실제 원문(Raw Data) 문장들만 단 하나도 누락 없이 100% 모두 포함해야 합니다. 절대로 번역하거나 요약, 변형하지 말고, 원래 입력된 원문 문장 텍스트 '그대로' 추출하십시오.\n[중요3]: "count" 값은 반드시 "opinions" 배열에 추출된 원문 문장의 총 개수와 정확히 일치해야 합니다.\n[중요4]: 분석 속도를 극대화하기 위해 불필요한 설명이나 수식어를 생략하고 오직 JSON 데이터만 즉시 출력하십시오.\nProvide JSON: {"summary": "EXECUTIVE SUMMARY", "categories": [{"name": "카테고리명", "summary": "분석 내용", "count": 0, "opinions": []}]}`,
            
            STEP2: (data, note) => `Data: "${data}"\n${note ? `[사용자 수정 요청]: ${note}` : ""}\n디자인 및 UX 측면에서 매우 정교하게 세분화된 카테고라이징을 수행하십시오. 분석 요약(summary)은 한국어로 작성하며 ** 강조 표시는 금지합니다.\n[중요1]: "UX/DESIGN SUMMARY" 및 각 이슈별 "summary" 분석 내용은 반드시 4줄에서 5줄 분량으로만 작성하십시오.\n[중요2]: "opinions" 배열에는 해당 카테고리의 요약 내용에 해당되는 실제 원문(Raw Data) 문장들만 단 하나도 누락 없이 100% 모두 포함해야 합니다. 절대로 번역하거나 요약, 변형하지 말고, 원문 텍스트 '그대로' 추출하십시오.\n[중요3]: "count" 값은 반드시 "opinions" 배열에 추출된 원문 문장의 총 개수와 정확히 일치해야 합니다.\n[중요4]: 분석 속도를 극대화하기 위해 불필요한 설명이나 수식어를 생략하고 오직 JSON 데이터만 즉시 출력하십시오.\nProvide JSON: {"summary": "UX/DESIGN SUMMARY", "uxCategories": [{"name": "이슈명", "summary": "분석 내용", "count": 0, "opinions": []}]}`,

            ANALYSIS: (perspective, input, note) => `You are a Senior Root Cause Analyst. Strictly lens: [${perspective}]. \n${note ? `[Revision Request]: ${note}` : ""}\nDerivate 3 to 6 distinct 5Why chains. Format: Why [N]\\n왜 [질문]?\\n→ [답변]\\n핵심: [요약].\n[중요]: 오직 JSON 형식으로만 즉시 출력하십시오.\nReturn ONLY a JSON: { "rootCauses": [ { "id": 1, "chain": ["Why 1\\\\n왜...\\\\n→...\\\\n핵심:...","Why 2...","Why 3...","Why 4...","Why 5..."], "realCause": "..." } ] }`,
            
            HYPOTHESIS: (perspective, input, cause, note) => `# Role: 전문 UX 전략 컨설턴트. # Context: 도출된 '5Why 진짜 원인'과 선택된 [${perspective}]을 바탕으로 확장 가설 제시. \n${note ? `[수정 요청 반영]: ${note}` : ""}\n[중요1]: Step 1, Step 2, Step 3 각각의 내용은 반드시 3줄에서 4줄 분량으로만 간결하게 핵심을 제공하십시오.\n[중요2]: 응답 속도 최적화를 위해 오직 JSON 형식으로만 즉시 출력하십시오.\nReturn ONLY a JSON: { "hypotheses": [ { "id": 1, "title": "...", "step1": "...", "step2": "...", "step3": "..." }, { "id": 2, "title": "...", "step1": "...", "step2": "...", "step3": "..." } ] }`,
            
            SUMMARY: (input, cause, hypo, note) => `You are a Senior Insight Strategist.\nReturn ONLY a JSON object:\n{\n  "finalReport": {\n    "step1": { "title": "분석 대상 가설", "content": "..." },\n    "step2": { "title": "5Whys 분석", "content": "..." },\n    "step3": { "title": "확장된 문제 가설", "content": "..." },\n    "step4": { "title": "전략적 해결 방향", "content": "..." }\n  }\n}`
        };

        const AIQuestionBox = ({ qaInput, setQaInput, askAI }) => (
            <div className="p-6 bg-slate-800 rounded-[2rem] shadow-xl space-y-4 my-8 relative overflow-hidden group">
                <div className="absolute inset-0 bg-gradient-to-r from-blue-500/10 to-indigo-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <div className="flex items-center gap-2 text-white relative z-10">
                    <Icon name="MessageSquare" size={18} className="text-blue-400" />
                    <span className="font-bold uppercase tracking-widest text-[15px] opacity-90">AI에게 수정 요청하기</span>
                    <button onClick={() => askAI(qaInput)} className="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-xl ml-auto active:scale-95 transition-all shadow-lg shadow-blue-600/30">
                        <Icon name="Send" size={18} />
                    </button>
                </div>
                <input type="text" value={qaInput} onChange={(e) => setQaInput(e.target.value)} className="w-full bg-white/5 border border-white/10 focus:border-blue-500/50 rounded-xl px-5 py-4 text-white text-[16px] outline-none placeholder:text-white/30 transition-colors relative z-10" placeholder="추가적인 수정 사항을 입력해 주세요" onKeyDown={(e) => e.key === 'Enter' && askAI(qaInput)} />
            </div>
        );

        const Header = ({ step, setStep, copyAccumulatedContent, resetAll, apiKey, step1Result, step2Result, selectedCategory, rootCauses, deepHypotheses, finalBrief }) => {
            const canGoForward = 
                (step === 0 && apiKey) ||
                (step === 1 && step1Result) || 
                (step === 2 && step2Result) || 
                (step === 3 && selectedCategory) || 
                (step === 4 && rootCauses?.length > 0) ||
                (step === 5 && deepHypotheses?.length > 0) ||
                (step === 6 && finalBrief);

            const canGoBack = step > 0;
            
            return (
                <header className="fixed top-0 left-0 right-0 z-50 glass-panel px-4 h-16 flex items-center justify-between max-w-[430px] mx-auto">
                    <div className="flex items-center gap-1 flex-1">
                        {canGoBack && (
                            <button onClick={() => setStep(s => s - 1)} className="p-2 -ml-2 rounded-full hover:bg-slate-100/80 shrink-0"><Icon name="ChevronLeft" size={24} className="text-slate-600"/></button>
                        )}
                        <h1 className="font-bold text-[18px] text-slate-800 truncate">디자인 분석 엔진</h1>
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                        {canGoForward && (
                            <button onClick={() => setStep(s => s + 1)} className="p-2 rounded-full hover:bg-slate-100/80 shrink-0"><Icon name="ChevronRight" size={24} className="text-slate-800" /></button>
                        )}
                        <button onClick={copyAccumulatedContent} className="p-2 rounded-full hover:bg-slate-100/80 shrink-0"><Icon name="Copy" size={20} className="text-slate-500" /></button>
                        <button onClick={resetAll} className="p-2 rounded-full hover:bg-slate-100/80 shrink-0"><Icon name="Home" size={20} className="text-slate-500" /></button>
                    </div>
                </header>
            );
        };

        const App = () => {
            const [apiKey, setApiKey] = useState(safeGetItem(SESSION_KEY) || "");
            const [step, setStep] = useState(0); 
            const [rawData, setRawData] = useState("");
            const [itemCount, setItemCount] = useState(0);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [error, setError] = useState(null);
            
            const [step1Result, setStep1Result] = useState(null);
            const [step2Result, setStep2Result] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [deepDiveInput, setDeepDiveInput] = useState("");
            const [perspective, setPerspective] = useState("사용 불편 관점");
            const [rootCauses, setRootCauses] = useState([]);
            const [selectedCauseId, setSelectedCauseId] = useState(null);
            const [deepHypotheses, setDeepHypotheses] = useState([]);
            const [selectedDeepHypoId, setSelectedDeepHypoId] = useState(null);
            const [finalBrief, setFinalBrief] = useState(null);

            const [qaInput, setQaInput] = useState("");
            const [opinionModal, setOpinionModal] = useState({ visible: false, title: "", opinions: [] });

            const forceSave = (override = {}) => {
                const currentState = {
                    step, rawData, step1Result, step2Result, selectedCategory, deepDiveInput, perspective, rootCauses, selectedCauseId, deepHypotheses, selectedDeepHypoId, finalBrief, ...override
                };
                safeSetItem(LOCAL_STORAGE_KEY, JSON.stringify(currentState));
            };

            const loadSavedState = () => {
                const saved = safeGetItem(LOCAL_STORAGE_KEY);
                if (!saved) { alert("기존에 저장된 분석 내용이 없습니다."); return; }
                try {
                    const p = JSON.parse(saved);
                    setRawData(p.rawData || "");
                    if (p.rawData) {
                        setItemCount(p.rawData.split('\n').filter(line => line.trim().length > 0).length);
                    } else {
                        setItemCount(0);
                    }
                    setStep1Result(p.step1Result);
                    setStep2Result(p.step2Result);
                    setSelectedCategory(p.selectedCategory);
                    setDeepDiveInput(p.deepDiveInput || "");
                    setPerspective(p.perspective || "사용 불편 관점");
                    setRootCauses(p.rootCauses || []);
                    setSelectedCauseId(p.selectedCauseId);
                    setDeepHypotheses(p.deepHypotheses || []);
                    setSelectedDeepHypoId(p.selectedDeepHypoId);
                    setFinalBrief(p.finalBrief);
                    setStep(p.step || 1);
                    alert("이전 분석 데이터가 성공적으로 복구되었습니다.");
                } catch(e) { alert("데이터 복구 중 오류가 발생했습니다."); }
            };

            useEffect(() => { setTimeout(() => window.scrollTo(0,0), 50); }, [step]);

            const processAndLimitData = (text, showWarning = false) => {
                const lines = text.split('\n').filter(line => line.trim().length > 0);
                if (lines.length > 500) {
                    if (showWarning) alert(`입력된 데이터가 500개를 초과하여 상위 500개만 분석을 진행합니다.`);
                    const limitedLines = lines.slice(0, 500);
                    return { finalData: limitedLines.join('\n'), count: 500 };
                }
                return { finalData: lines.join('\n'), count: lines.length };
            };

            const updateDataAndCount = (text) => {
                const { finalData, count } = processAndLimitData(text, false);
                setRawData(finalData);
                setItemCount(count);
                forceSave({ rawData: finalData, step: 1 });
            };

            const handleFileUpload = (e) => {
                const f = e.target.files[0];
                if (!f) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = new Uint8Array(ev.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                        const text = json.map(row => row.join(' ')).join('\n');
                        const { finalData, count } = processAndLimitData(text, true);
                        setRawData(finalData);
                        setItemCount(count);
                        forceSave({ rawData: finalData, step: 1 });
                    } catch(err) { alert("파일 처리 중 오류 발생"); }
                };
                reader.readAsArrayBuffer(f);
                e.target.value = null; 
            };

            const callGemini = async (prompt, isJson = true, systemInstruction = null) => {
                setIsAnalyzing(true);
                let delay = 500; 
                for (let i = 0; i < 5; i++) {
                    try {
                        const payload = {
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: isJson ? { responseMimeType: "application/json" } : {}
                        };
                        if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`API 오류 (${response.status})`);
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                        setIsAnalyzing(false);
                        return isJson ? JSON.parse(jsonStr) : text;
                    } catch (err) {
                        if (i === 4) { setIsAnalyzing(false); throw err; }
                        await new Promise(r => setTimeout(r, delay)); delay *= 1.5;
                    }
                }
            };

            const validateKey = async (inputKey) => {
                if (!inputKey) return;
                setLoadingMsg("API 키 확인 중...");
                setIsAnalyzing(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${inputKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "OK" }] }] })
                    });
                    if (response.ok) {
                        setApiKey(inputKey); safeSetItem(SESSION_KEY, inputKey); setStep(1); setError(null);
                    } else throw new Error();
                } catch { setError("API 인증 실패. 키를 확인해 주세요."); }
                finally { setIsAnalyzing(false); }
            };

            const askAI = async (note) => {
                if(!note) return;
                setLoadingMsg("요청 반영 중...");
                try {
                    if (step === 2) await handleStep1Analysis(note);
                    else if (step === 3) await handleStep2Analysis(note);
                    else if (step === 5) await start5WhysAnalysis(note);
                    else if (step === 6) await exploreDeepHypotheses(selectedCauseId, note);
                    else if (step === 7) await generateFinalReport(selectedDeepHypoId, note);
                    setQaInput("");
                } catch { setError("오류 발생"); }
            };

            const handleStep1Analysis = async (note = null) => {
                setLoadingMsg("1단계 분석 중...");
                try {
                    const res = await callGemini(PROMPTS.STEP1(rawData, note));
                    setStep1Result(res); setStep(2);
                    forceSave({ step1Result: res, step: 2 });
                } catch { setError("분석 실패"); }
            };

            const handleStep2Analysis = async (note = null) => {
                setLoadingMsg("2단계 분석 중...");
                try {
                    const res = await callGemini(PROMPTS.STEP2(rawData, note));
                    setStep2Result(res); setStep(3);
                    forceSave({ step2Result: res, step: 3 });
                } catch { setError("분석 실패"); }
            };

            const start5WhysAnalysis = async (note = null) => {
                setLoadingMsg("5Whys 분석 중...");
                try {
                    const res = await callGemini(`Input: ${deepDiveInput}`, true, PROMPTS.ANALYSIS(perspective, deepDiveInput, note));
                    if (res && res.rootCauses) { setRootCauses(res.rootCauses); setSelectedCauseId(null); setStep(5); forceSave({ rootCauses: res.rootCauses, step: 5 }); }
                } catch { setError("분석 실패"); }
            };

            const changePerspective = async (p) => {
                if (perspective === p) return; setPerspective(p);
                setLoadingMsg(`${p} 관점 재분석...`);
                try {
                    const res = await callGemini(`Input: ${deepDiveInput}`, true, PROMPTS.ANALYSIS(p, deepDiveInput));
                    if (res && res.rootCauses) { setRootCauses(res.rootCauses); setSelectedCauseId(null); forceSave({ rootCauses: res.rootCauses, perspective: p }); }
                } catch { setError("오류 발생"); }
            };

            const changePerspectiveInStep6 = async (p) => {
                if (perspective === p) return; setPerspective(p);
                setLoadingMsg(`${p} 관점 인사이트 도출...`);
                const selected = rootCauses.find(c => c.id === selectedCauseId);
                try {
                    const res = await callGemini(`Cause: ${selected.realCause}`, true, PROMPTS.HYPOTHESIS(p, deepDiveInput, selected.realCause));
                    if(res && res.hypotheses) { setDeepHypotheses(res.hypotheses); setSelectedDeepHypoId(null); forceSave({ deepHypotheses: res.hypotheses, perspective: p }); }
                } catch { setError("오류 발생"); }
            };

            const exploreDeepHypotheses = (id, note = null) => {
                setSelectedCauseId(id);
                const selected = rootCauses.find(c => c.id === id);
                setLoadingMsg("인사이트 도출 중...");
                callGemini(`Cause: ${selected.realCause}`, true, PROMPTS.HYPOTHESIS(perspective, deepDiveInput, selected.realCause, note))
                    .then(res => { if(res && res.hypotheses) { setDeepHypotheses(res.hypotheses); setSelectedDeepHypoId(null); setStep(6); forceSave({ deepHypotheses: res.hypotheses, selectedCauseId: id, step: 6 }); } });
            };

            const generateFinalReport = (id, note = null) => {
                setSelectedDeepHypoId(id);
                const selectedHypo = deepHypotheses.find(h => h.id === id);
                const selectedCause = rootCauses.find(c => c.id === selectedCauseId);
                setLoadingMsg("최종 리포트 생성 중...");
                callGemini(`Cause: ${selectedCause.realCause}\nHypo: ${selectedHypo.title}`, true, PROMPTS.SUMMARY(deepDiveInput, selectedCause.realCause, selectedHypo.title, note))
                    .then(res => { if(res && res.finalReport) { setFinalBrief(res.finalReport); setStep(7); forceSave({ finalBrief: res.finalReport, selectedDeepHypoId: id, step: 7 }); } });
            };

            const fallbackCopyTextToClipboard = (text, successMsg) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try { document.execCommand('copy'); alert(successMsg); } 
                catch (err) { alert("복사에 실패했습니다. 브라우저 설정을 확인해 주세요."); }
                document.body.removeChild(textArea);
            };

            const copyAccumulatedContent = () => {
                let text = "[누적 분석 리포트]\n\n";
                if (step >= 2 && step1Result) {
                    text += "--- 1단계: 전체 데이터 분석 ---\n";
                    text += `Executive Summary: ${step1Result.summary}\n\n`;
                    step1Result.categories.forEach(c => text += `[${c.name}]\n${c.summary}\n\n`);
                }
                if (step >= 3 && step2Result) {
                    text += "--- 2단계: UX/DESIGN 심화 분석 ---\n";
                    text += `UX/Design Summary: ${step2Result.summary}\n\n`;
                    step2Result.uxCategories.forEach(c => text += `[${c.name}]\n${c.summary}\n\n`);
                }
                if (step >= 4 && deepDiveInput) {
                    text += "--- 3단계: 분석 대상 가설 ---\n" + deepDiveInput + "\n\n";
                }
                if (step >= 5 && selectedCauseId) {
                    const cause = rootCauses.find(c => c.id === selectedCauseId);
                    if(cause) text += "--- 4단계: 5Whys 분석 결과 ---\n" + cause.chain.join('\n') + `\nReal Cause: ${cause.realCause}\n\n`;
                }
                if (step >= 6 && selectedDeepHypoId) {
                    const hypo = deepHypotheses.find(h => h.id === selectedDeepHypoId);
                    if(hypo) text += `--- 5단계: 디자인 인사이트 제안 ---\n가설: ${hypo.title}\n\nStep 1: ${hypo.step1}\n\nStep 2: ${hypo.step2}\n\nStep 3: ${hypo.step3}\n\n`;
                }
                if (step === 7 && finalBrief) {
                    text += `--- 최종 통합 리포트 ---\n[${finalBrief.step1.title}]\n${finalBrief.step1.content}\n\n[${finalBrief.step2.title}]\n${finalBrief.step2.content}\n\n[${finalBrief.step3.title}]\n${finalBrief.step3.content}\n\n[전략적 해결 방향]\n${finalBrief.step4.content}\n\n`;
                }

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => alert("전체 누적 리포트가 복사되었습니다.")).catch(() => fallbackCopyTextToClipboard(text, "전체 누적 리포트가 복사되었습니다."));
                } else { fallbackCopyTextToClipboard(text, "전체 누적 리포트가 복사되었습니다."); }
            };

            const copyRawDataModal = (text) => { 
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => alert("원문 데이터 복사됨")).catch(() => fallbackCopyTextToClipboard(text, "원문 데이터 복사됨"));
                } else { fallbackCopyTextToClipboard(text, "원문 데이터 복사됨"); }
            };

            const resetAll = () => { setStep(1); setStep1Result(null); setStep2Result(null); setSelectedCategory(null); setRawData(""); setItemCount(0); setPerspective("사용 불편 관점"); safeRemoveItem(LOCAL_STORAGE_KEY); };

            return (
                <div className="w-full max-w-[430px] mx-auto bg-[#f8fafc] min-h-screen relative font-sans text-slate-900 pb-10 shadow-[0_0_60px_rgba(0,0,0,0.05)]">
                    {isAnalyzing && (
                        <div className="fixed inset-0 z-[10000] glass-panel flex flex-col items-center justify-center p-6 text-center max-w-[430px] mx-auto">
                            <div className="w-20 h-20 rounded-full border-[4px] border-slate-100 border-t-[#4355FF] animate-spin mb-8 flex items-center justify-center shadow-lg shadow-blue-500/20">
                                <Icon name="Sparkles" size={28} className="text-[#4355FF] animate-pulse" />
                            </div>
                            <h3 className="text-[22px] font-black mb-3 text-slate-800">심층 분석 진행 중</h3>
                            <p className="text-slate-500 font-medium leading-relaxed">{loadingMsg}</p>
                        </div>
                    )}

                    {error && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/40 p-6 backdrop-blur-sm">
                            <div className="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl border border-slate-100">
                                <Icon name="AlertCircle" size={32} className="text-red-500 mx-auto mb-5" />
                                <p className="text-slate-700 mb-8 font-bold">{error}</p>
                                <button onClick={() => setError(null)} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">확인</button>
                            </div>
                        </div>
                    )}

                    <Header step={step} setStep={setStep} copyAccumulatedContent={copyAccumulatedContent} resetAll={resetAll} apiKey={apiKey} step1Result={step1Result} step2Result={step2Result} selectedCategory={selectedCategory} rootCauses={rootCauses} deepHypotheses={deepHypotheses} finalBrief={finalBrief} />

                    <main id="main-content" className="pt-16">
                        {step === 0 && (
                            <div className="min-h-screen flex flex-col items-center justify-center p-10 bg-white text-center animate-fade-in">
                                <div className="w-24 h-24 bg-gradient-to-br from-[#4355FF] to-indigo-500 rounded-[2rem] flex items-center justify-center mb-10 shadow-2xl shadow-indigo-500/30 animate-float"><Icon name="Fingerprint" size={48} className="text-white" /></div>
                                <div className="w-full mb-2 px-2">
                                    <h1 className="font-black tracking-tighter gradient-text-primary leading-[1.2] pb-1 text-45px">User Voice Analysis</h1>
                                    <h1 className="font-black tracking-tighter gradient-text-primary leading-[1.2] pb-2 mb-6 text-45px">&amp; Design Insight</h1>
                                </div>
                                <p className="text-slate-400 font-medium mb-12 text-[16px]">데이터 분석에서 디자인 인사이트 도출까지</p>
                                <div className="w-full space-y-5">
                                    <div className="py-2">
                                        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" className="text-indigo-500 font-bold underline underline-offset-4 hover:text-indigo-600 transition-colors">개인 API Key 발급받기</a>
                                    </div>
                                    <input type="password" id="api-key-input" defaultValue={apiKey} className="w-full p-5 bg-slate-50 border border-slate-200 rounded-2xl text-center outline-none" placeholder="Gemini API KEY 입력" />
                                    <button onClick={() => validateKey(document.getElementById('api-key-input').value)} className="w-full py-5 bg-slate-900 text-white rounded-2xl font-black shadow-xl active:scale-95 transition-all">API Key 확인 후 시작</button>
                                </div>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="flex flex-col min-h-screen bg-slate-900 text-white p-8 pt-10 justify-center relative overflow-hidden animate-fade-in">
                                <div className="absolute top-[-10%] left-[-20%] w-[140%] h-[70%] bg-gradient-to-br from-indigo-600/30 to-blue-500/20 rounded-full blur-[100px] pointer-events-none"></div>
                                <div className="relative z-10 space-y-12">
                                    <div className="space-y-6">
                                        <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/20 font-bold uppercase tracking-widest text-[14px] backdrop-blur-sm">INTEGRATED INTELLIGENCE</div>
                                        <h1 className="font-black leading-tight tracking-tighter text-42px">데이터 기반으로<br/>사용자 마음을<br/><span className="text-blue-400 text-45px">발견하세요.</span></h1>
                                        <p className="text-slate-400 leading-relaxed text-[17px] font-light">Raw 데이터 분석에서 5Whys 진짜 원인 파악까지 한번에 진행하는 올인원 도구입니다.</p>
                                    </div>
                                    <div className="space-y-5">
                                        <div>
                                            <textarea rows={5} value={rawData} onChange={(e) => updateDataAndCount(e.target.value)} className="w-full bg-slate-800/50 backdrop-blur-md border border-white/10 focus:border-blue-400/50 rounded-[2rem] p-7 text-white outline-none text-[17px] resize-none leading-relaxed transition-colors shadow-inner" placeholder="수집한 User Voice 데이터를 입력하거나 업로드 하세요"></textarea>
                                            {itemCount > 0 ? (
                                                <p className="text-right text-blue-400 font-bold text-[15px] mt-3 pr-3 animate-fade-in tracking-wide">
                                                    ✓ 분석 반영 데이터: <span className="text-white">{itemCount}</span>개 {itemCount >= 500 ? <span className="text-orange-400 ml-1">(최대 한도 500개 적용됨)</span> : null}
                                                </p>
                                            ) : null}
                                        </div>
                                        <div className="flex gap-3 mt-10">
                                            <input type="file" id="file-up" className="hidden" onChange={handleFileUpload} />
                                            <label htmlFor="file-up" className="flex-1 bg-white/10 hover:bg-white/15 py-4 rounded-[1.2rem] text-center font-bold cursor-pointer transition-colors flex items-center justify-center">파일 업로드</label>
                                            <button onClick={() => handleStep1Analysis()} disabled={!rawData.trim()} className="flex-1 bg-blue-600 disabled:bg-slate-700 text-white rounded-[1.2rem] font-black py-4">분석 시작</button>
                                        </div>
                                        <button onClick={loadSavedState} className="w-full mt-3 py-4 bg-white/5 hover:bg-white/10 text-slate-300 rounded-[1.2rem] font-bold border border-white/10 flex items-center justify-center gap-2"><Icon name="History" size={18} />기존 분석 내용 불러오기</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === 2 && step1Result && (
                            <div className="pt-8 px-5 pb-32 animate-fade-in">
                                <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white mb-8 shadow-2xl relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl"></div>
                                    <span className="bg-blue-600/20 text-blue-300 border border-blue-500/30 px-4 py-1.5 rounded-full font-black uppercase mb-5 inline-block text-[13px]">EXECUTIVE SUMMARY</span>
                                    <p className="text-[17px] font-light leading-[1.8] text-slate-200 text-justify whitespace-pre-line relative z-10">"{step1Result.summary}"</p>
                                </div>
                                <div className="space-y-5">
                                    {step1Result.categories.map((cat, i) => (
                                        <div key={i} className="bg-white p-7 rounded-[2rem] card-shadow border border-slate-100 flex flex-col transition-all">
                                            <div className="flex justify-between items-start mb-5">
                                                <h3 className="font-black text-slate-800 text-[20px] leading-tight pr-2 flex-1">{cat.name}</h3>
                                                <button onClick={() => setOpinionModal({ visible: true, title: cat.name, opinions: cat.opinions })} className="bg-slate-50 px-4 py-1.5 rounded-xl font-bold text-slate-500 text-[14px] shrink-0 ml-2">{cat.count || 0}건 확인</button>
                                            </div>
                                            <p className="text-slate-600 font-light leading-relaxed">{cat.summary}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-5 glass-panel border-t max-w-[430px] mx-auto z-[60]"><button onClick={() => handleStep2Analysis()} className="w-full py-5 bg-slate-900 text-white rounded-[1.2rem] font-black text-lg active:scale-95 transition-all">2단계: UX/디자인 심화 분석 이동</button></div>
                            </div>
                        )}

                        {step === 3 && step2Result && (
                            <div className="pt-8 px-5 pb-48 animate-fade-in">
                                <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white mb-8 shadow-2xl text-justify relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl"></div>
                                    <span className="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-4 py-1.5 rounded-full font-black uppercase mb-5 inline-block text-[13px]">UX/DESIGN SUMMARY</span>
                                    <p className="text-[17px] font-light leading-[1.8] text-slate-200 relative z-10">"{step2Result.summary}"</p>
                                </div>
                                <div className="space-y-5 mb-12">
                                    {step2Result.uxCategories.map((cat, i) => (
                                        <div key={i} className={`p-7 rounded-[2.5rem] transition-all card-shadow bg-white ${selectedCategory?.name === cat.name ? 'border-[3px] border-indigo-500 ring-4 ring-indigo-500/10' : 'border border-slate-100'}`}>
                                            <div className="flex justify-between items-start mb-5">
                                                <h3 className="font-black text-20px flex-1 text-slate-800 leading-tight pr-2">{cat.name}</h3>
                                                <div className="flex flex-col items-end gap-2.5 shrink-0 ml-2">
                                                    <button onClick={() => setOpinionModal({ visible: true, title: cat.name, opinions: cat.opinions })} className="bg-slate-50 px-4 py-1.5 rounded-xl text-slate-500 font-bold text-[13px]">원문 보기</button>
                                                    <button onClick={() => { setSelectedCategory(cat); setDeepDiveInput(`이슈: ${cat.name}\n내용: ${cat.summary}`); forceSave({ selectedCategory: cat, deepDiveInput: `이슈: ${cat.name}\n내용: ${cat.summary}` }); }} className={`px-6 py-2.5 rounded-xl font-black transition-all shadow-md active:scale-95 text-[15px] ${selectedCategory?.name === cat.name ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-white'}`}>이슈 선택</button>
                                                </div>
                                            </div>
                                            <p className="text-slate-600 text-[17px] font-light leading-relaxed">{cat.summary}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-6 glass-panel border-t max-w-[430px] mx-auto z-[60] shadow-2xl">
                                    <div className="mb-4 text-center text-slate-600 text-[15px] font-bold">{selectedCategory ? `"${selectedCategory.name}" 선택됨` : "항목을 선택하세요"}</div>
                                    <button disabled={!selectedCategory} onClick={() => setStep(4)} className="w-full py-5 bg-orange-500 text-white rounded-[1.2rem] font-black text-lg active:scale-95 transition-all shadow-xl shadow-orange-500/30 disabled:bg-slate-200 disabled:shadow-none">5Whys 분석 시작</button>
                                </div>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="pt-8 px-6 pb-48 animate-fade-in">
                                <h2 className="text-28px font-black text-slate-800 leading-tight mb-8">분석할 <span className="gradient-text text-28px">대상 가설</span></h2>
                                <div className="bg-white p-6 rounded-[2rem] card-shadow border border-orange-100 mb-8"><textarea value={deepDiveInput} onChange={(e) => setDeepDiveInput(e.target.value)} className="w-full h-64 outline-none text-[17px] text-slate-700 font-light resize-none leading-relaxed"></textarea></div>
                                <div className="fixed bottom-0 left-0 right-0 p-6 glass-panel border-t max-w-[430px] mx-auto z-40"><button onClick={() => start5WhysAnalysis()} className="w-full py-5 bg-slate-900 text-white rounded-[1.2rem] font-black shadow-xl active:scale-95 transition-all">5Whys 원인 분석 실행</button></div>
                            </div>
                        )}

                        {step === 5 && rootCauses.length > 0 && (
                            <div className="pt-8 px-5 pb-64 animate-fade-in">
                                <div className="space-y-6">
                                    {rootCauses.map((rc) => (
                                        <div key={rc.id} className={`p-7 rounded-[2rem] transition-all card-shadow bg-white ${selectedCauseId === rc.id ? 'border-[3px] border-orange-500 ring-4 ring-orange-500/10' : 'border border-slate-100'}`}>
                                            <div className="flex justify-between items-center mb-6">
                                                <span className="bg-orange-50 text-orange-600 px-4 py-1.5 rounded-full font-bold text-[14px]">Case {rc.id}</span>
                                                <button onClick={() => setSelectedCauseId(rc.id)} className={`px-6 py-2 rounded-xl font-black shadow-md active:scale-95 text-[15px] ${selectedCauseId === rc.id ? 'bg-orange-500 text-white' : 'bg-slate-900 text-white'}`}>원인 선택</button>
                                            </div>
                                            <div className="space-y-4 mb-8 text-slate-700">
                                                {rc.chain?.map((cStep, idx) => {
                                                    const lines = cStep.split(/\\n|₩n|\n/);
                                                    return (
                                                        <div key={idx} className="mb-4">
                                                            {lines.map((line, lidx) => (<span key={lidx} className={lidx === 0 ? 'font-black text-slate-900 block text-[17px] mb-1' : 'block font-normal text-slate-600 leading-relaxed text-[16px]'}>{line}</span>))}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <div className="pt-6 border-t border-slate-100"><div className="inline-block bg-orange-100 text-orange-600 px-3 py-1 rounded-md text-[12px] font-black mb-3 uppercase">Real Cause</div><p className="text-[18px] font-bold text-slate-800">{rc.realCause}</p></div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-6 glass-panel max-w-[430px] mx-auto z-40 border-t shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                                    <div className="grid grid-cols-2 gap-2 mb-5">
                                        {['사용 불편 관점', '기술 진화 관점', '심미적 관점', '비지니스 관점'].map(p => (
                                            <button key={p} onClick={() => changePerspective(p)} className={`py-3 rounded-xl text-[14px] font-bold border transition-all ${perspective === p ? 'bg-orange-50 border-orange-400 text-orange-600 shadow-sm' : 'bg-white border-slate-200 text-slate-500'}`}>{p}</button>
                                        ))}
                                    </div>
                                    <button onClick={() => exploreDeepHypotheses(selectedCauseId)} disabled={selectedCauseId === null} className="w-full py-5 rounded-[1.2rem] font-black bg-slate-900 text-white shadow-xl active:scale-95 transition-all disabled:bg-slate-200">디자인 인사이트 도출</button>
                                </div>
                            </div>
                        )}

                        {step === 6 && deepHypotheses.length > 0 && (
                            <div className="pt-8 px-5 pb-80 animate-fade-in">
                                <div className="grid gap-6">
                                    {deepHypotheses.map(h => (
                                        <div key={h.id} className={`p-8 rounded-[2.5rem] transition-all card-shadow bg-white ${selectedDeepHypoId === h.id ? 'border-[3px] border-indigo-500 ring-4 ring-indigo-500/10' : 'border border-slate-100'}`}>
                                            <div className="flex flex-col mb-6 border-b pb-5">
                                                <div className="flex justify-end mb-4"><button onClick={() => setSelectedDeepHypoId(h.id)} className={`px-7 py-2.5 rounded-xl font-black shadow-md active:scale-95 text-[15px] ${selectedDeepHypoId === h.id ? 'bg-slate-900 text-white ring-2 ring-offset-2 ring-slate-900' : 'bg-slate-800 text-white'}`}>가설 선택</button></div>
                                                <h3 className="text-[22px] font-black text-slate-900 leading-snug">{h.title}</h3>
                                            </div>
                                            <div className="space-y-8">
                                                {[{t:'Step 1. 표면적 원인 대처', c:h.step1}, {t:'Step 2. 맥락적 원인 재해석', c:h.step2}, {t:'Step 3. 맥락적 인사이트 제안', c:h.step3}].map((item, idx) => (
                                                    <div key={idx} className="relative">
                                                        <div className="absolute left-0 top-2 w-1.5 h-1.5 rounded-full bg-orange-400"></div>
                                                        <p className="text-[17px] font-bold text-slate-800 mb-2 pl-4">{item.t}</p>
                                                        <p className="text-[17px] text-slate-600 font-light text-justify leading-relaxed pl-4">{item.c}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-6 glass-panel border-t max-w-[430px] mx-auto z-40 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                                    <div className="grid grid-cols-2 gap-2 mb-5">
                                        {['사용 불편 관점', '기술 진화 관점', '심미적 관점', '비지니스 관점'].map(p => (
                                            <button key={p} onClick={() => changePerspectiveInStep6(p)} className={`py-3 rounded-xl font-bold border transition-all ${perspective === p ? 'bg-indigo-50 border-indigo-400 text-indigo-600 shadow-sm' : 'bg-white border-slate-200 text-slate-500'}`}>{p}</button>
                                        ))}
                                    </div>
                                    <button onClick={() => generateFinalReport(selectedDeepHypoId)} disabled={selectedDeepHypoId === null} className="w-full py-5 bg-slate-900 text-white rounded-[1.2rem] font-black shadow-xl active:scale-95 transition-all disabled:bg-slate-200 disabled:shadow-none">최종 통합 리포트 생성</button>
                                </div>
                            </div>
                        )}

                        {step === 7 && finalBrief && (
                            <div className="pt-8 px-5 pb-48 animate-fade-in">
                                <div className="space-y-6">
                                    {[finalBrief.step1, finalBrief.step2, finalBrief.step3].map((s, i) => (
                                        <div key={i} className="bg-white p-8 rounded-[2.5rem] card-shadow border border-slate-100 text-justify">
                                            <div className="flex items-center gap-3 mb-4"><div className="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-600 font-black text-[14px]">{i+1}</div><h3 className="text-[18px] font-black text-slate-800">{s.title === "5Why 진짜 원인" ? "5Whys 분석" : s.title}</h3></div>
                                            <p className="text-[17px] text-slate-600 font-light leading-relaxed">{s.content}</p>
                                        </div>
                                    ))}
                                    <div className="bg-slate-900 p-9 rounded-[2.5rem] shadow-2xl relative overflow-hidden mt-8">
                                        <div className="absolute top-0 right-0 w-40 h-40 bg-gradient-to-br from-blue-500/20 to-indigo-500/20 rounded-full blur-3xl"></div>
                                        <div className="inline-block bg-indigo-500/20 border border-indigo-500/30 px-5 py-2 rounded-full text-[13px] font-black uppercase text-indigo-300 mb-6 relative z-10">전략적 해결 방향</div>
                                        <p className="text-[18px] text-slate-100 font-light leading-[1.8] text-justify relative z-10">"{finalBrief.step4?.content}"</p>
                                    </div>
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-6 glass-panel max-w-[430px] mx-auto border-t z-40"><button onClick={copyAccumulatedContent} className="w-full py-5 bg-blue-600 text-white rounded-[1.2rem] font-black shadow-xl active:scale-95 transition-all">전체 리포트 복사하기</button></div>
                            </div>
                        )}
                    </main>

                    {opinionModal.visible && (
                        <div className="fixed inset-0 z-[2000] flex items-center justify-center bg-slate-900/60 p-5 backdrop-blur-sm">
                            <div className="bg-white text-slate-800 p-8 rounded-[2.5rem] w-full max-w-[390px] shadow-2xl relative border border-slate-100 overflow-hidden flex flex-col max-h-[85vh]">
                                <div className="absolute top-4 right-4 flex items-center z-10">
                                    <button onClick={() => copyRawDataModal(opinionModal.opinions.join('\n'))} className="w-12 h-12 flex items-center justify-center text-blue-500 hover:bg-blue-50 rounded-full transition-colors"><Icon name="Copy" size={24} /></button>
                                    <button onClick={() => setOpinionModal({ visible: false, title: "", opinions: [] })} className="w-12 h-12 flex items-center justify-center text-slate-400 hover:bg-slate-100 rounded-full transition-colors ml-1"><Icon name="X" size={26} /></button>
                                </div>
                                <div className="mb-6 pr-20 mt-2 relative z-10">
                                    <div className="flex items-center gap-2 mb-3"><Icon name="Quote" className="text-blue-500 w-5 h-5" /><span className="text-[13px] font-black text-blue-500 uppercase tracking-widest">Raw Data</span></div>
                                    <h4 className="text-[20px] font-black text-slate-900 leading-tight">"{opinionModal.title}"</h4>
                                </div>
                                <div className="space-y-3 overflow-y-auto pr-2 no-scrollbar flex-1 relative z-10">
                                    {opinionModal.opinions.map((op, idx) => (
                                        <div key={idx} className="p-4 bg-slate-50 rounded-2xl border border-slate-100/80 text-justify whitespace-pre-line hover:border-slate-200 transition-colors">
                                            <p className="text-[16px] font-light leading-relaxed text-slate-700">"{op}"</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-white to-transparent pointer-events-none z-20"></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
