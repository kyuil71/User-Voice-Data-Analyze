<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Voice Analyze & Design Insight</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- XLSX Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }
        .gradient-text { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        
        /* Global font size constraints */
        * { font-size: 16px; }
        .text-45px { font-size: 45px !important; }
        .text-42px { font-size: 42px !important; }
        .text-40px { font-size: 40px !important; }
        .text-28px { font-size: 28px !important; }
        .text-20px { font-size: 20px !important; }
        .text-19px { font-size: 19px !important; }
        .text-18px { font-size: 18px !important; }
        .text-17px { font-size: 17px !important; }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const iconName = name.replace(/([A-Z])/g, "-$1").toLowerCase().replace(/^-/, "");
            return <i data-lucide={iconName} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const MODEL_NAME = "gemini-flash-latest"; 
        const SESSION_KEY = "gemini_api_key_ux_hub_integrated";

        const PROMPTS = {
            STEP1: (data, note) => `Data: "${data}"
${note ? `[사용자 수정 요청]: ${note}` : ""}
분석 요약(summary)은 한국어로 작성하십시오. 답변 내에 ** 강조 표시를 절대로 포함하지 마십시오.
[중요1]: 각 카테고리별 "summary" 분석 내용의 양을 기존보다 50% 더 늘려서 아주 상세하고 논리적인 근거를 포함하여 풍부하게 기술하십시오.
[중요2]: "opinions" 배열에는 해당 카테고리의 요약 내용에 해당되는 실제 원문(Raw Data) 문장들만 단 하나도 누락 없이 100% 모두 포함해야 합니다. 절대로 번역하거나 요약, 변형하지 말고, 영어면 영어, 한국어면 한국어 등 원래 입력된 원문 문장 텍스트 '그대로' 추출하십시오.
[중요3]: "count" 값은 반드시 "opinions" 배열에 추출된 원문 문장의 총 개수와 정확히 일치해야 합니다.
Provide overall categorization and summary in JSON: {"summary": "EXECUTIVE SUMMARY (상세히 작성)", "categories": [{"name": "카테고리명", "summary": "상세 분석 내용 (기존보다 50% 분량 증가)", "count": "opinions 배열의 항목 개수와 반드시 동일한 숫자", "opinions": ["원문 그대로 1", "원문 그대로 2"]}]}`,
            
            STEP2: (data, note) => `Data: "${data}"
${note ? `[사용자 수정 요청]: ${note}` : ""}
디자인 및 UX 측면에서 매우 정교하게 세분화된 카테고라이징을 수행하십시오. 분석 요약(summary)은 한국어로 작성하며 ** 강조 표시는 금지합니다.
[중요1]: 각 이슈별 "summary" 분석 내용의 양을 기존보다 50% 더 늘려서 전문적이고 깊이 있게 기술하십시오.
[중요2]: "opinions" 배열에는 해당 카테고리의 요약 내용에 해당되는 실제 원문(Raw Data) 문장들만 단 하나도 누락 없이 100% 모두 포함해야 합니다. 절대로 번역하거나 요약, 변형하지 말고, 영어면 영어, 한국어면 한국어 등 원래 입력된 원문 문장 텍스트 '그대로' 추출하십시오.
[중요3]: "count" 값은 반드시 "opinions" 배열에 추출된 원문 문장의 총 개수와 정확히 일치해야 합니다.
Provide JSON: {"summary": "UX/DESIGN SUMMARY", "uxCategories": [{"name": "이슈명", "summary": "상세 분석 내용 (기존보다 50% 분량 증가)", "count": "opinions 배열의 항목 개수와 반드시 동일한 숫자", "opinions": ["원문 그대로 1", "원문 그대로 2"]}]}`,

            ANALYSIS: (perspective, input, note) => `You are a Senior Root Cause Analyst. Strictly lens: [${perspective}]. 
${note ? `[Revision Request]: ${note}` : ""}
Derivate 3 to 6 distinct 5Why chains. Format: Why [N]\n왜 [질문]?\n→ [답변]\n핵심: [요약]. Return ONLY a JSON: { "rootCauses": [ { "id": 1, "chain": ["Why 1\\n왜...\\n→...\\n핵심:...","Why 2...","Why 3...","Why 4...","Why 5..."], "realCause": "..." } ] }`,
            
            HYPOTHESIS: (perspective, input, cause, note) => `# Role: 전문 UX 전략 컨설턴트. # Context: 도출된 '5Why 진짜 원인'과 선택된 [${perspective}]을 바탕으로 확장 가설 제시. 
${note ? `[수정 요청 반영]: ${note}` : ""}
[중요1]: 반드시 [${perspective}]에 철저히 입각하여, 이 관점만의 독특하고 차별화된 전략적 해결책을 도출해야 합니다.
[중요2]: 반드시 정확히 2개의 제안(가설)만 생성하십시오.
[중요3]: Step 1, 2, 3 각각의 내용 분량을 기존보다 50% 더 늘려서 매우 구체적이고 전략적인 통찰을 제공하십시오.
Return ONLY a JSON: { "hypotheses": [ { "id": 1, "title": "...", "step1": "...", "step2": "...", "step3": "..." }, { "id": 2, "title": "...", "step1": "...", "step2": "...", "step3": "..." } ] }`,
            
            SUMMARY: (input, cause, hypo, note) => `You are a Senior Insight Strategist. Synthesize the journey.
${note ? `[수정 요청 반영]: ${note}` : ""}
[IMPORTANT]: Generate the "content" for each step VERY DETAILED. Reduce the total word count by 10% compared to a "maximum filler" version to ensure every sentence carries high strategic weight.
Return ONLY a JSON object:
{
  "finalReport": {
    "step1": { "title": "분석 대상 가설", "content": "..." },
    "step2": { "title": "5Whys 분석", "content": "..." },
    "step3": { "title": "확장된 문제 가설", "content": "..." },
    "step4": { "title": "전략적 해결 방향", "content": "..." }
  }
}`
        };

        const AIQuestionBox = ({ qaInput, setQaInput, askAI }) => (
            <div className="p-6 bg-slate-700 rounded-[2rem] shadow-xl space-y-4 my-8">
                <div className="flex items-center gap-2 text-white">
                    <Icon name="MessageSquare" size={16} className="text-blue-400" />
                    <span className="font-black uppercase tracking-widest text-[16px]">AI에게 수정 요청하기</span>
                    <button onClick={() => askAI(qaInput)} className="bg-blue-600 text-white p-2 rounded-lg ml-auto active:scale-90"><Icon name="Send" size={16} /></button>
                </div>
                <input type="text" value={qaInput} onChange={(e) => setQaInput(e.target.value)} className="w-full bg-white/10 border-none rounded-xl px-4 py-3 text-white text-[16px] outline-none placeholder:text-white/30" placeholder="수정을 요청하세요" onKeyDown={(e) => e.key === 'Enter' && askAI(qaInput)} />
            </div>
        );

        const Header = ({ step, setStep, step1Result, step2Result, selectedCategory, rootCauses, deepHypotheses, finalBrief, resetAll }) => {
            const canGoForward = 
                (step === 1 && step1Result) || 
                (step === 2 && step2Result) || 
                (step === 3 && selectedCategory) || 
                (step === 5 && rootCauses.length > 0) ||
                (step === 6 && deepHypotheses?.length > 0);

            const canGoBack = step > 0;

            const getDynamicTitle = () => {
                if (step === 0) return "인증 및 시작";
                if (step === 2) return "전체 데이터 분석";
                if (step === 3) return "UX/DESIGN 데이터 분석";
                if (step === 4) return "5Whys 분석";
                if (step === 5) return "5Whys 분석 결과";
                if (step === 6) return "디자인 인사이트 제안";
                if (step === 7) return "전체 요약 리포트";
                return "디자인 분석 엔진";
            };
            
            return (
                <header className="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/50 px-4 h-14 flex items-center justify-between max-w-[430px] mx-auto overflow-hidden">
                    <div className="flex items-center gap-1 flex-1 overflow-hidden">
                        {canGoBack && (
                            <button onClick={() => setStep(s => s - 1)} className="p-2 -ml-2 rounded-full hover:bg-slate-100 shrink-0">
                                <Icon name="ChevronLeft" size={24} className="text-slate-500"/>
                            </button>
                        )}
                        <h1 className="font-bold text-[18px] text-slate-900 truncate leading-tight">{getDynamicTitle()}</h1>
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                        {canGoForward && <button onClick={() => setStep(s => s + 1)} className="p-2 rounded-full hover:bg-slate-100 shrink-0"><Icon name="ChevronRight" size={24} className="text-slate-900" /></button>}
                        <button onClick={resetAll} className="p-2 rounded-full hover:bg-slate-100 shrink-0"><Icon name="Home" size={20} className="text-slate-500" /></button>
                    </div>
                </header>
            );
        };

        const App = () => {
            const [apiKey, setApiKey] = useState(sessionStorage.getItem(SESSION_KEY) || "");
            const [step, setStep] = useState(apiKey ? 1 : 0);
            const [rawData, setRawData] = useState("");
            const [itemCount, setItemCount] = useState(0);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [error, setError] = useState(null);
            
            const [step1Result, setStep1Result] = useState(null);
            const [step2Result, setStep2Result] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [deepDiveInput, setDeepDiveInput] = useState("");
            const [perspective, setPerspective] = useState("사용 불편 관점");
            const [rootCauses, setRootCauses] = useState([]);
            const [selectedCauseId, setSelectedCauseId] = useState(null);
            const [deepHypotheses, setDeepHypotheses] = useState([]);
            const [selectedDeepHypoId, setSelectedDeepHypoId] = useState(null);
            const [finalBrief, setFinalBrief] = useState(null);

            const [qaInput, setQaInput] = useState("");
            const [qaModal, setQaModal] = useState({ visible: false, question: "", answer: "" });
            const [opinionModal, setOpinionModal] = useState({ visible: false, title: "", opinions: [] });

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            useEffect(() => { window.scrollTo({ top: 0, behavior: 'instant' }); }, [step]);

            const updateDataAndCount = (text) => {
                setRawData(text);
                setItemCount(text.split('\n').filter(line => line.trim().length > 0).length);
            };

            const callGemini = async (prompt, isJson = true, systemInstruction = null) => {
                setIsAnalyzing(true);
                let delay = 1000;
                for (let i = 0; i < 5; i++) {
                    try {
                        const payload = {
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: isJson ? { responseMimeType: "application/json" } : {}
                        };
                        if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`API 오류 (${response.status})`);
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                        setIsAnalyzing(false);
                        return isJson ? JSON.parse(jsonStr) : text;
                    } catch (err) {
                        if (i === 4) { setIsAnalyzing(false); throw err; }
                        await new Promise(r => setTimeout(r, delay)); delay *= 2;
                    }
                }
            };

            const validateKey = async (inputKey) => {
                if (!inputKey) return;
                setLoadingMsg("API 키 확인 중...");
                setIsAnalyzing(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${inputKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "OK" }] }] })
                    });
                    if (response.ok) {
                        setApiKey(inputKey); sessionStorage.setItem(SESSION_KEY, inputKey); setStep(1); setError(null);
                    } else throw new Error();
                } catch { setError("API 인증 실패. 키를 확인해 주세요."); }
                finally { setIsAnalyzing(false); }
            };

            const askAI = async (note) => {
                if(!note) return;
                setLoadingMsg("요청 사항을 반영하여 분석을 다시 수행 중입니다...");
                try {
                    if (step === 2) await handleStep1Analysis(note);
                    else if (step === 3) await handleStep2Analysis(note);
                    else if (step === 5) await start5WhysAnalysis(note);
                    else if (step === 6) await exploreDeepHypotheses(selectedCauseId, note);
                    else if (step === 7) await generateFinalReport(selectedDeepHypoId, note);
                    setQaInput("");
                } catch { setError("수정 요청 처리 중 오류가 발생했습니다."); }
            };

            const handleStep1Analysis = async (note = null) => {
                setLoadingMsg(note ? "수정 요청을 반영 중..." : "전체 카테고리 분석 중...");
                try {
                    const res = await callGemini(PROMPTS.STEP1(rawData, note));
                    setStep1Result(res); setStep(2);
                } catch { setError("1단계 분석 실패"); }
            };

            const handleStep2Analysis = async (note = null) => {
                setLoadingMsg(note ? "수정 요청을 반영 중..." : "UX/디자인 심화 분석 중...");
                try {
                    const res = await callGemini(PROMPTS.STEP2(rawData, note));
                    setStep2Result(res); setStep(3);
                } catch { setError("2단계 분석 실패"); }
            };

            const start5WhysAnalysis = async (note = null) => {
                setLoadingMsg(note ? "수정 요청을 반영 중..." : `[${perspective}] 5Whys 분석 중...`);
                try {
                    const res = await callGemini(`Input: ${deepDiveInput}`, true, PROMPTS.ANALYSIS(perspective, deepDiveInput, note));
                    if (res && res.rootCauses) { setRootCauses(res.rootCauses); setSelectedCauseId(null); setStep(5); }
                } catch { setError("5Whys 분석 실패"); }
            };

            const changePerspective = async (p) => {
                if (perspective === p) return; setPerspective(p);
                setLoadingMsg(`[${p}] 관점으로 재분석 중...`);
                try {
                    const res = await callGemini(`Input: ${deepDiveInput}`, true, PROMPTS.ANALYSIS(p, deepDiveInput));
                    if (res && res.rootCauses) { setRootCauses(res.rootCauses); setSelectedCauseId(null); }
                } catch { setError("관점 변경 분석 중 오류가 발생했습니다."); }
            };

            const changePerspectiveInStep6 = async (p) => {
                if (perspective === p) return; 
                setPerspective(p);
                setLoadingMsg(`[${p}] 관점으로 디자인 인사이트를 다시 도출 중입니다...`);
                const selected = rootCauses.find(c => c.id === selectedCauseId);
                try {
                    const res = await callGemini(`Cause: ${selected.realCause}`, true, PROMPTS.HYPOTHESIS(p, deepDiveInput, selected.realCause));
                    if(res && res.hypotheses) { 
                        setDeepHypotheses(res.hypotheses); 
                        setSelectedDeepHypoId(null); 
                    }
                } catch { setError("인사이트 재도출 중 오류 발생"); }
            };

            const exploreDeepHypotheses = (id, note = null) => {
                setSelectedCauseId(id);
                const selected = rootCauses.find(c => c.id === id);
                setLoadingMsg(note ? "수정 요청을 반영 중..." : `디자인 인사이트 도출 중...`);
                callGemini(`Cause: ${selected.realCause}`, true, PROMPTS.HYPOTHESIS(perspective, deepDiveInput, selected.realCause, note))
                    .then(res => { if(res && res.hypotheses) { setDeepHypotheses(res.hypotheses); setSelectedDeepHypoId(null); setStep(6); } });
            };

            const generateFinalReport = (id, note = null) => {
                setSelectedDeepHypoId(id);
                const selectedHypo = deepHypotheses.find(h => h.id === id);
                const selectedCause = rootCauses.find(c => c.id === selectedCauseId);
                setLoadingMsg(note ? "수정 요청을 반영 중..." : "최종 통합 리포트 생성 중...");
                callGemini(`Cause: ${selectedCause.realCause}\nHypo: ${selectedHypo.title}`, true, PROMPTS.SUMMARY(deepDiveInput, selectedCause.realCause, selectedHypo.title, note))
                    .then(res => { if(res && res.finalReport) { setFinalBrief(res.finalReport); setStep(7); } });
            };

            const handleFileUpload = (e) => {
                const f = e.target.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = (ev) => updateDataAndCount(ev.target.result);
                r.readAsText(f);
            };

            const resetAll = () => { setStep(1); setStep1Result(null); setStep2Result(null); setSelectedCategory(null); setRawData(""); setPerspective("사용 불편 관점"); };

            return (
                <div className="w-full max-w-[430px] mx-auto bg-[#f8fafc] min-h-screen shadow-2xl relative font-sans text-slate-900 pb-10">
                    {isAnalyzing && (
                        <div className="fixed inset-0 z-[10000] bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center max-w-[430px] mx-auto">
                            <div className="w-20 h-20 rounded-full border-[6px] border-slate-100 border-t-orange-500 animate-spin mb-8 flex items-center justify-center">
                                <Icon name="Sparkles" size={32} className="text-orange-500 animate-pulse" />
                            </div>
                            <h3 className="text-[22px] font-black mb-3">심층 분석 진행 중</h3>
                            <p className="text-slate-600 font-medium leading-relaxed">{loadingMsg}</p>
                        </div>
                    )}

                    {error && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/50 p-6 backdrop-blur-sm">
                            <div className="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl animate-fade-in">
                                <Icon name="AlertCircle" size={48} className="text-red-500 mx-auto mb-4" />
                                <p className="text-slate-700 mb-6 font-bold">{error}</p>
                                <button onClick={() => setError(null)} className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">확인</button>
                            </div>
                        </div>
                    )}
                    <main id="main-content" className="pt-14 pb-10">
                        {step === 0 && (
                            <div className="min-h-screen flex flex-col items-center justify-center p-10 bg-white text-center animate-fade-in">
                                <div className="w-24 h-24 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-[2rem] flex items-center justify-center mb-10 shadow-2xl">
                                    <Icon name="Fingerprint" size={48} className="text-white" />
                                </div>
                                <div className="w-full mb-2 px-2">
                                    <h1 className="font-black tracking-tighter text-[#4355FF] leading-[1.1] text-45px">User Voice Analyze</h1>
                                    <h1 className="font-black tracking-tighter text-[#4355FF] leading-[1.1] mb-8 text-45px">& Design Insight</h1>
                                </div>
                                <p className="text-[#94A3B8] font-bold mb-12 text-[16px]">데이터 분석에서 디자인 인사이트 도출까지</p>
                                <div className="w-full space-y-4">
                                    <div className="py-2">
                                        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" className="text-indigo-600 font-bold text-[16px] underline underline-offset-4">개인 API Key 발급받기</a>
                                    </div>
                                    <input type="password" id="api-key-input" className="w-full p-5 bg-white border-2 border-slate-100 rounded-2xl text-center outline-none text-[16px]" placeholder="Gemini API KEY 입력" />
                                    <p className="text-gray-500 text-[16px]">유효한 Gemini API 키를 입력해 주세요.</p>
                                    <button onClick={() => validateKey(document.getElementById('api-key-input').value)} className="w-full py-5 bg-slate-900 text-white rounded-2xl font-black text-[17px] shadow-xl">API Key 확인 후 시작</button>
                                </div>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="flex flex-col min-h-screen bg-slate-900 text-white animate-fade-in p-8 pt-10 justify-center relative overflow-hidden">
                                <div className="absolute top-[-20%] left-[-20%] w-[140%] h-[60%] bg-blue-600 rounded-full blur-[100px] opacity-20"></div>
                                <div className="relative z-10 space-y-12">
                                    <div className="space-y-6">
                                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/20 font-bold uppercase tracking-widest text-[16px]">INTEGRATED INTELLIGENCE</div>
                                        <h1 className="font-black leading-tight tracking-tighter text-42px">데이터 기반으로<br/>사용자 마음을<br/><span className="text-sky-400 text-45px">발견하세요.</span></h1>
                                        <p className="text-slate-400 leading-relaxed text-[17px]">Raw 데이터 분석에서 5Whys 진짜 원인 파악까지 한번에 진행하는 올인원 도구입니다.</p>
                                    </div>
                                    <div className="space-y-4">
                                        <textarea rows={4} value={rawData} onChange={(e) => updateDataAndCount(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-[2rem] p-6 text-white outline-none text-[17px] resize-none leading-relaxed" placeholder="수집한 User Voice 데이터를 입력하거나 업로드 하세요" />
                                        <div className="flex gap-2 mt-14">
                                            <input type="file" id="file-up" className="hidden" onChange={handleFileUpload} />
                                            <label htmlFor="file-up" className="flex-1 bg-white/10 py-4 rounded-2xl text-center font-bold cursor-pointer flex items-center justify-center">엑셀/텍스트 업로드</label>
                                            <button onClick={() => handleStep1Analysis()} disabled={!rawData.trim()} className="flex-1 bg-white text-slate-900 rounded-2xl font-black shadow-xl active:scale-95 transition-all">1단계 분석 시작</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === 2 && step1Result && (
                            <div className="pt-6 px-4 animate-fade-in pb-32">
                                <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white mb-6 shadow-2xl">
                                    <span className="bg-blue-600 px-3 py-1 rounded-full font-black tracking-widest uppercase mb-4 inline-block">EXECUTIVE SUMMARY</span>
                                    <p className="text-[17px] font-medium leading-[1.8] italic opacity-90 text-justify whitespace-pre-line">"{step1Result.summary}"</p>
                                </div>
                                <div className="space-y-4">
                                    {step1Result.categories.map((cat, i) => (
                                        <div key={i} className="bg-white p-7 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col text-justify card-shadow">
                                            <div className="flex justify-between items-start mb-4">
                                                <h3 className="font-black text-lg flex-1 leading-tight text-slate-900 text-[20px]">{cat.name}</h3>
                                                <button onClick={() => setOpinionModal({ visible: true, title: cat.name, opinions: cat.opinions })} className="bg-slate-100 px-3 py-1 rounded-lg font-black text-slate-500 shrink-0 ml-2 hover:bg-blue-600 hover:text-white transition-all active:scale-90 whitespace-nowrap">{cat.opinions ? cat.opinions.length : 0}건 확인</button>
                                            </div>
                                            <p className="text-slate-500 font-medium leading-relaxed w-full text-[17px] whitespace-pre-line">{cat.summary}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-5 bg-white/95 backdrop-blur-md border-t max-w-[430px] mx-auto z-[60]">
                                    <button onClick={handleStep2Analysis} className="w-full py-6 bg-slate-900 text-white rounded-2xl font-black text-lg active:scale-95 transition-all">2단계: UX/디자인 심화 분석 이동</button>
                                </div>
                            </div>
                        )}

                        {step === 3 && step2Result && (
                            <div className="pt-6 px-4 animate-fade-in pb-48">
                                <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white mb-8 shadow-2xl text-justify">
                                    <span className="bg-indigo-600 px-3 py-1 rounded-full font-black tracking-widest uppercase mb-4 inline-block">UX/DESIGN SUMMARY</span>
                                    <p className="text-[17px] font-medium opacity-90 italic">"{step2Result.summary}"</p>
                                </div>
                                <div className="space-y-4 mb-12">
                                    {step2Result.uxCategories.map((cat, i) => (
                                        <div key={i} className={`p-7 rounded-[2rem] border transition-all card-shadow bg-white ${selectedCategory?.name === cat.name ? 'border-slate-700 ring-4 ring-slate-700 bg-slate-50' : 'border-slate-100'}`}>
                                            <div className="flex justify-between items-start mb-4">
                                                <h3 className="font-black text-20px flex-1 text-slate-900">{cat.name}</h3>
                                                <div className="flex flex-col items-end gap-2 shrink-0 ml-2">
                                                    <button onClick={() => setOpinionModal({ visible: true, title: cat.name, opinions: cat.opinions })} className="bg-slate-100 px-3 py-1 rounded-lg text-slate-500 font-bold text-sm hover:bg-slate-200 whitespace-nowrap">{cat.opinions ? cat.opinions.length : 0}건 확인</button>
                                                    <button onClick={() => { setSelectedCategory(cat); setDeepDiveInput(`분석 이슈: ${cat.name}\n상세 내용: ${cat.summary}`); }} className={`px-6 py-2 text-white rounded-lg font-black transition-colors shadow-md ${selectedCategory?.name === cat.name ? 'bg-slate-800' : 'bg-[#4355FF]'}`}>선택</button>
                                                </div>
                                            </div>
                                            <p className="text-slate-500 text-[17px] text-justify leading-relaxed whitespace-pre-line">{cat.summary}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-5 bg-white/95 backdrop-blur-md border-t max-w-[430px] mx-auto z-[60]">
                                    <div className="mb-4 text-center"><p className="text-[17px] font-black text-slate-900 tracking-tight">{selectedCategory ? `"${selectedCategory.name}"가 선택되었습니다` : "항목의 [선택] 버튼을 눌러 분석을 진행하세요"}</p></div>
                                    <button disabled={!selectedCategory} onClick={() => setStep(4)} className="w-full py-6 bg-orange-600 text-white rounded-2xl font-black text-lg active:scale-95 transition-all shadow-lg shadow-orange-600/20 disabled:bg-slate-200">5Whys 분석 시작</button>
                                </div>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="pt-6 px-6 animate-fade-in pb-48">
                                <div className="mb-8">
                                    <h2 className="text-28px font-black text-slate-900 leading-tight">분석할 <span className="gradient-text text-28px">대상 가설</span></h2>
                                    <p className="text-slate-500 font-medium mt-2">필요 시 수정하여 분석을 시작하세요.</p>
                                </div>
                                <div className="bg-white p-5 rounded-[2rem] card-shadow border border-orange-100 mb-8">
                                    <textarea value={deepDiveInput} onChange={(e) => setDeepDiveInput(e.target.value)} className="w-full h-56 outline-none text-[17px] font-medium resize-none bg-transparent leading-relaxed" />
                                </div>
                                <div className="fixed bottom-0 left-0 right-0 p-6 bg-transparent max-w-[430px] mx-auto z-40">
                                    <button onClick={() => start5WhysAnalysis()} className="w-full py-5 bg-slate-900 text-white rounded-[1.2rem] font-black text-[17px] shadow-xl active:scale-95 transition-all">5Whys 분석 시작</button>
                                </div>
                            </div>
                        )}

                        {step === 5 && rootCauses.length > 0 && (
                            <div className="pt-6 px-5 animate-fade-in pb-64">
                                <div className="space-y-5">
                                    {rootCauses.map((rc) => (
                                        <div key={rc.id} className={`p-6 rounded-[1.8rem] border-2 transition-all card-shadow ${selectedCauseId === rc.id ? 'bg-slate-50 border-slate-700 ring-4 ring-slate-700' : 'bg-white border-slate-100'}`}>
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="bg-orange-100 text-orange-600 px-3 py-1 rounded-full font-bold">Analysis Case {rc.id}</span>
                                                <button onClick={() => setSelectedCauseId(rc.id)} className={`px-6 py-2 text-white rounded-lg font-black transition-colors shadow-md ${selectedCauseId === rc.id ? 'bg-slate-800' : 'bg-[#4355FF]'}`}>선택</button>
                                            </div>
                                            <div className="space-y-4 mb-6 border-l-2 border-slate-100 pl-4 text-slate-900 text-justify">
                                                {rc.chain?.map((cStep, idx) => (
                                                    <p key={idx} className="whitespace-pre-line text-[16px]">
                                                        {cStep.split('\n').map((line, lidx) => (<span key={lidx} className={line.startsWith('Why') ? 'font-black block' : 'block'}>{line}</span>))}
                                                    </p>
                                                ))}
                                            </div>
                                            <div className="pt-4 border-t border-slate-200">
                                                <p className="text-[16px] font-black text-orange-500 uppercase tracking-widest">Real Cause (진짜 원인)</p>
                                                <p className="text-[17px] font-bold text-slate-900 leading-relaxed">{rc.realCause}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-6 bg-white/95 backdrop-blur-md max-w-[430px] mx-auto z-40 border-t shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                                    <div className="grid grid-cols-2 gap-2 mb-4">
                                        {['사용 불편 관점', '기술 진화 관점', '심미적 관점', '비지니스 관점'].map(p => (
                                            <button key={p} onClick={() => changePerspective(p)} className={`py-2.5 rounded-xl text-[16px] font-bold border transition-all ${perspective === p ? 'bg-orange-50 border-orange-500 text-orange-600' : 'bg-white border-slate-200 text-slate-500'}`}>{p}</button>
                                        ))}
                                    </div>
                                    <button onClick={() => exploreDeepHypotheses(selectedCauseId)} disabled={selectedCauseId === null} className="w-full py-5 rounded-[1.2rem] font-black text-[17px] bg-slate-900 text-white disabled:bg-slate-200 active:scale-95 transition-all">디자인 인사이트 도출</button>
                                </div>
                            </div>
                        )}

                        {step === 6 && deepHypotheses.length > 0 && (
                            <div className="pt-6 px-5 animate-fade-in pb-64">
                                <div className="grid gap-5">
                                    {deepHypotheses.map(h => (
                                        <div key={h.id} className={`p-7 rounded-[2rem] border-2 transition-all card-shadow ${selectedDeepHypoId === h.id ? 'bg-slate-50 border-slate-700 ring-4 ring-slate-700' : 'bg-white border-slate-100'}`}>
                                            <div className="flex justify-between items-start mb-5 border-b pb-4">
                                                <h3 className="text-19px font-black flex-1 mr-2 text-slate-900">{h.title}</h3>
                                                <button onClick={() => setSelectedDeepHypoId(h.id)} className={`px-6 py-2 text-white rounded-lg font-black transition-colors shadow-md shrink-0 ${selectedDeepHypoId === h.id ? 'bg-slate-800' : 'bg-[#4355FF]'}`}>선택</button>
                                            </div>
                                            <div className="space-y-6">
                                                {[{t:'Step 1. 표면적 원인 대처', c:h.step1}, {t:'Step 2. 맥락적 원인 재해석', c:h.step2}, {t:'Step 3. 맥락적 인사이트 제안', c:h.step3}].map((item, idx) => (
                                                    <div key={idx} className={idx > 0 ? "pt-5 border-t border-slate-100" : ""}>
                                                        <p className="text-18px font-bold text-orange-600 mb-2 uppercase tracking-wide">{item.t}</p>
                                                        <p className="text-[17px] text-slate-900 font-light text-justify leading-relaxed whitespace-pre-line">{item.c}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-6 bg-white/95 backdrop-blur-md border-t max-w-[430px] mx-auto z-40">
                                    <div className="grid grid-cols-2 gap-2 mb-4 px-1">
                                        {['사용 불편 관점', '기술 진화 관점', '심미적 관점', '비지니스 관점'].map(p => (
                                            <button key={p} onClick={() => changePerspectiveInStep6(p)} className={`py-3 rounded-xl font-bold border transition-all text-[15px] ${perspective === p ? 'bg-orange-50 border-orange-500 text-orange-600 ring-2 ring-orange-200' : 'bg-white border-slate-200 text-slate-500'}`}>{p}</button>
                                        ))}
                                    </div>
                                    <button onClick={() => generateFinalReport(selectedDeepHypoId)} disabled={selectedDeepHypoId === null} className="w-full py-5 bg-slate-900 text-white rounded-[1.2rem] font-black active:scale-95 transition-all">최종 통합 리포트 생성</button>
                                </div>
                            </div>
                        )}

                        {step === 7 && finalBrief && (
                            <div className="pt-6 px-5 animate-fade-in pb-48">
                                <div className="space-y-5">
                                    {[finalBrief.step1, finalBrief.step2, finalBrief.step3].map((s, i) => (
                                        <div key={i} className="bg-white p-7 rounded-[2rem] card-shadow border border-slate-100 text-justify">
                                            <h3 className="text-18px font-bold text-orange-600 mb-3 tracking-widest uppercase">{s.title === "5Why 진짜 원인" ? "5Whys 분석" : s.title}</h3>
                                            <p className="text-[17px] text-black font-light leading-relaxed whitespace-pre-line">{s.content}</p>
                                        </div>
                                    ))}
                                    <div className="bg-slate-900 p-8 rounded-[2rem] shadow-xl relative overflow-hidden">
                                        <div className="inline-block bg-indigo-600 px-4 py-1.5 rounded-full text-[13px] font-black uppercase tracking-widest text-white mb-5">전략적 해결 방향</div>
                                        <p className="text-18px text-white font-medium opacity-95 italic text-justify leading-relaxed">"{finalBrief.step4?.content}"</p>
                                    </div>
                                </div>
                                <div className="mt-8"><AIQuestionBox qaInput={qaInput} setQaInput={setQaInput} askAI={askAI} /></div>
                                <div className="fixed bottom-0 left-0 right-0 p-6 bg-white/90 backdrop-blur-md max-w-[430px] mx-auto border-t shadow-2xl">
                                    <button onClick={() => { 
                                        const text = `[전체 요약 리포트]\n\n${finalBrief.step1.title}: ${finalBrief.step1.content}\n\n${finalBrief.step2.title}: ${finalBrief.step2.content}\n\n${finalBrief.step3.title}: ${finalBrief.step3.content}\n\n전략적 해결 방향: ${finalBrief.step4.content}`;
                                        const area = document.createElement('textarea'); area.value = text; document.body.appendChild(area); area.select(); document.execCommand('copy'); document.body.removeChild(area);
                                        alert("리포트가 복사되었습니다.");
                                    }} className="w-full py-5 bg-slate-900 text-white rounded-[1.2rem] font-black shadow-xl active:scale-95 transition-all">전체 리포트 복사하기</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Step Result Modal (원문 보기) */}
                    {opinionModal.visible && (
                        <div className="fixed inset-0 z-[2000] flex items-center justify-center bg-black/60 p-6 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white text-slate-900 p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl relative border border-slate-100 overflow-hidden flex flex-col">
                                <div className="absolute top-6 right-6 flex items-center gap-2">
                                    <button onClick={() => {
                                        const text = opinionModal.opinions.join('\n');
                                        const area = document.createElement('textarea'); area.value = text; document.body.appendChild(area); area.select(); document.execCommand('copy'); document.body.removeChild(area);
                                        alert("원문 데이터가 복사되었습니다.");
                                    }} className="p-2 text-blue-600 hover:bg-blue-50 rounded-full transition-all" title="텍스트 복사"><Icon name="Copy" size={24} /></button>
                                    <button onClick={() => setOpinionModal({ visible: false, title: "", opinions: [] })} className="p-2 text-slate-400 hover:text-slate-900 hover:bg-slate-100 rounded-full transition-all"><Icon name="X" size={24} /></button>
                                </div>
                                <div className="mb-6 pr-12">
                                    <div className="flex items-center gap-2 mb-2"><Icon name="Quote" className="text-blue-600 w-5 h-5 fill-blue-600/10" /><span className="text-[14px] font-black text-blue-600 uppercase tracking-widest">Raw Data Feedback</span></div>
                                    <h4 className="text-xl font-black text-slate-900 leading-tight">"{opinionModal.title}" 원문 의견</h4>
                                </div>
                                <div className="space-y-2 overflow-y-auto max-h-[60vh] pr-2 no-scrollbar flex-1">
                                    {opinionModal.opinions.map((op, idx) => (
                                        <div key={idx} className="p-3.5 bg-slate-50 rounded-xl border border-slate-100 text-justify whitespace-pre-line"><p className="text-[17px] font-medium leading-normal text-slate-700 italic">"{op}"</p></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
